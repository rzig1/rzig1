# Redraws the profile's generated images every day and publishes them to the "output" branch:
#   - github-snake.svg / github-snake-dark.svg  (contribution snake)
#   - stats.svg                                 (custom stats card, .github/scripts/stats.py)
# Both must be built in this one workflow: the publish step replaces the whole "output" branch.
name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

# Only one run at a time: two runs pushing to "output" together make one of them fail.
concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      # snk runs in a Docker container as root, so dist/ ends up root-owned.
      - name: Fix dist/ ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate stats card
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py "${{ github.repository_owner }}" dist/stats.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
