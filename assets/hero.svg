<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e2a4a"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".5" stop-color="#38bdf8"/><stop offset=".65" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".55" stop-color="#fb7185"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="ms" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="floor"><rect x="0" y="236" width="860" height="94" fill="url(#fade)"/></mask>
<mask id="sunm"><rect x="300" y="96" width="260" height="140" fill="#fff"/><rect x="300" y="166" width="260" height="4" fill="#000"><animate attributeName="y" values="166;138" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="180" width="260" height="4" fill="#000"><animate attributeName="y" values="180;152" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="194" width="260" height="4" fill="#000"><animate attributeName="y" values="194;166" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="208" width="260" height="4" fill="#000"><animate attributeName="y" values="208;180" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="222" width="260" height="4" fill="#000"><animate attributeName="y" values="222;194" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="236" width="260" height="4" fill="#000"><animate attributeName="y" values="236;208" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="250" width="260" height="4" fill="#000"><animate attributeName="y" values="250;222" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect><rect x="300" y="264" width="260" height="4" fill="#000"><animate attributeName="y" values="264;236" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="2;6" dur="2.4s" repeatCount="indefinite"/></rect></mask>
<clipPath id="card"><rect width="860" height="330" rx="20"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes line{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.f1{animation:float 6s ease-in-out infinite} .f2{animation:float 7s ease-in-out infinite 1.2s}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.in1{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) forwards .2s} .in2{opacity:0;animation:fadeUp .9s ease forwards .8s} .in3{opacity:0;animation:fadeUp .9s ease forwards 1.4s}
.ul{stroke-dasharray:420;stroke-dashoffset:420;animation:line 1.4s cubic-bezier(.7,0,.3,1) forwards .6s}
.caret{animation:blink 1s step-end infinite}
</style>
<rect width="860" height="330" rx="20" fill="url(#bg)"/><rect width="860" height="330" rx="20" fill="url(#dots)"/>
<g clip-path="url(#card)">
