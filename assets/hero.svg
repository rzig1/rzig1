" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/><animate attributeName="y2" values="236;334" dur="3.6s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/><animate attributeName="stroke-opacity" values="0;.9" dur="3.6s" begin="-2.4s" repeatCount="indefinite"/></line><line x1="0" x2="860" y1="236" y2="236"><animate attributeName="y1" values="236;334" dur="3.6s" begin="-3.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/><animate attributeName="y2" values="236;334" dur="3.6s" begin="-3.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/><animate attributeName="stroke-opacity" values="0;.9" dur="3.6s" begin="-3.0s" repeatCount="indefinite"/></line></g>
  </g>
  <line x1="0" y1="236" x2="860" y2="236" stroke="#38bdf8" stroke-opacity=".5"/>
</g>

