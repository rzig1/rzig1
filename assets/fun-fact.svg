<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e2a4a"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="pl" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
</defs>
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

</style>
<rect width="860" height="290" rx="20" fill="url(#bg)"/>
<rect width="860" height="290" rx="20" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="859" height="289" rx="20" fill="none" stroke="#1e2a4a"/>

<text x="430" y="40" text-anchor="middle" class="mono" font-size="13" fill="#64748b">// fun fact</text>
<text x="430" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">I keep classic and modern stacks in balance to ship efficient, engaging UX</text>
<g transform="translate(430,214)">
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <rect x="-300" y="-8" width="600" height="10" rx="5" fill="url(#pl)"/>
    <g transform="translate(-205,0)"><rect x="-53.0" y="-34" width="106" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/><text x="0" y="-16" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Java Swing</text><rect x="-25.0" y="-64" width="50" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/><text x="0" y="-46" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">JSP</text><rect x="-65.0" y="-94" width="130" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/><text x="0" y="-76" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">SOAP services</text></g>
    <g transform="translate(205,0)"><rect x="-33.0" y="-34" width="66" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/><text x="0" y="-16" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">React</text><rect x="-41.0" y="-64" width="82" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/><text x="0" y="-46" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Next.js</text><rect x="-45.0" y="-94" width="90" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/><text x="0" y="-76" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Tailwind</text></g>
  </g>
  <polygon points="0,2 -26,46 26,46" fill="#a78bfa"/>
  <circle cx="0" cy="2" r="6" fill="#fff"/>
</g>
<text x="225" y="282" text-anchor="middle" class="mono" font-size="12" fill="#fbbf24">CLASSIC</text>
<text x="635" y="282" text-anchor="middle" class="mono" font-size="12" fill="#38bdf8">MODERN</text>

</svg>