<line x1="800" y1="116" x2="800" y2="66" stroke="#fb7185" stroke-opacity=".4" stroke-dasharray="2 3"/>
<text x="818" y="42" text-anchor="end" class="mono" font-size="11.5" fill="#fb7185" font-weight="700">Next</text>
<text x="818" y="59" text-anchor="end" font-size="14" font-weight="700" fill="#fff">Your project?</text>
<text x="818" y="75" text-anchor="end" font-size="11" fill="#94a3b8">let's build it together</text><circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M60,130 C140,60 200,60 250,130 S360,200 430,130 S540,60 610,130 S740,200 800,130"/></circle></g>
