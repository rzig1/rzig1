<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e2a4a"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
</defs>
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.dr{stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 3s ease forwards}@keyframes d{to{stroke-dashoffset:0}}
</style>
<rect width="860" height="270" rx="20" fill="url(#bg)"/>
<rect width="860" height="270" rx="20" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="859" height="269" rx="20" fill="none" stroke="#1e2a4a"/>
<g transform="translate(0,10)"><path d="M60,130 C140,60 200,60 250,130 S360,200 430,130 S540,60 610,130 S740,200 800,130" fill="none" stroke="#1e2a4a" stroke-width="6" stroke-linecap="round"/><path class="dr" d="M60,130 C140,60 200,60 250,130 S360,200 430,130 S540,60 610,130 S740,200 800,130" fill="none" stroke="url(#tg)" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="130" r="11" fill="#0b1120" stroke="#38bdf8" stroke-width="3"/><circle cx="60" cy="130" r="4" fill="#38bdf8"/>
<line x1="60" y1="116" x2="60" y2="66" stroke="#38bdf8" stroke-opacity=".4" stroke-dasharray="2 3"/>
