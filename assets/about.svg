<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.l0{opacity:0;animation:fadeUp .5s ease forwards 0.40s}.l1{opacity:0;animation:fadeUp .5s ease forwards 0.65s}.l2{opacity:0;animation:fadeUp .5s ease forwards 0.90s}.l3{opacity:0;animation:fadeUp .5s ease forwards 1.15s}.l4{opacity:0;animation:fadeUp .5s ease forwards 1.40s}.l5{opacity:0;animation:fadeUp .5s ease forwards 1.65s}.l6{opacity:0;animation:fadeUp .5s ease forwards 1.90s}.l7{opacity:0;animation:fadeUp .5s ease forwards 2.15s}.l8{opacity:0;animation:fadeUp .5s ease forwards 2.40s}.l9{opacity:0;animation:fadeUp .5s ease forwards 2.65s}.l10{opacity:0;animation:fadeUp .5s ease forwards 2.90s}.l11{opacity:0;animation:fadeUp .5s ease forwards 3.15s}.caret{animation:blink 1s step-end infinite} .sp{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite} .sp2{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite reverse} .f1{animation:float 5s ease-in-out infinite}
</style>
